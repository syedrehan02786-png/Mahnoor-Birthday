 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Mahnoor ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff9ecf,#ffd6ea);
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
text-align:center;
animation:fade 2s;
}

h1{
font-size:60px;
color:white;
text-shadow:0 0 20px hotpink;
animation:glow 2s infinite alternate;
}

p{
font-size:22px;
color:white;
margin-top:20px;
}

button{
margin-top:30px;
padding:15px 35px;
border:none;
border-radius:50px;
background:#ff2d75;
color:white;
font-size:20px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.1);
}

@keyframes glow{
from{
text-shadow:0 0 10px white;
}
to{
text-shadow:0 0 35px hotpink;
}
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}

.heart{
position:absolute;
color:pink;
font-size:30px;
animation:float 8s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
</style>

</head>

<body>

<div class="container">

<h1>🎉 Happy Birthday Mahnoor ❤️</h1>
<img src="photo.jpg"
 class="profile" alt="Mahnoor">
<p>
Meri pyaari dost Mahnoor ke liye ek special animated gift 💖
<br><br>
Allah tumhe hamesha khush rakhe,
har dua qubool ho,
aur tum hamesha muskurati raho. 🌹
</p>

<button onclick="wish()">
🎁 Open Special Gift
</button>

</div>

<script>

for(let i=0;i<40;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="💗";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(5+Math.random()*5)+"s";

h.style.fontSize=(20+Math.random()*30)+"px";

document.body.appendChild(h);

}

function wish(){

alert("Happy Birthday Mahnoor ❤️🎂");

}

</script>
<script src="script.js"></script>
</body>
</html>
